<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">AI Rules Sync</title>
  <desc id="desc">多个 Git 仓库克隆到全局缓存；每个项目按需挑选并映射到不同工具目录。</desc>
  <style>
    .line { fill: none; stroke-width: 2; stroke-dasharray: 5 4; stroke-linecap: round; }
    @media (prefers-reduced-motion: no-preference) {
      .line { animation: flow 0.75s linear infinite; }
    }
    @keyframes flow { to { stroke-dashoffset: -9; } }
  </style>
  <defs>
    <marker id="m-zh-co" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#DE5C2A"/>
    </marker>
    <marker id="m-zh-pe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="m-zh-cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4C63B6"/>
    </marker>
    <filter id="sh-zh" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#1F2328" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="439" rx="16" fill="#FAFBFC" stroke="#D8DEE4"/>

  <text x="40" y="38" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="800">AI Rules Sync</text>
  <text x="1160" y="36" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600" text-anchor="end">一处编辑，处处更新</text>
  <text x="40" y="60" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.4">多仓  ·  一处缓存  ·  多项目组合</text>

  <text x="150" y="90" fill="#656D76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">GIT 仓库</text>
  <text x="355" y="90" fill="#DE5C2A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="middle">git clone</text>
  <text x="600" y="88" fill="#656D76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">全局缓存</text>
  <text x="600" y="102" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" text-anchor="middle">~/.config/ai-rules-sync/repos</text>
  <text x="845" y="90" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="middle">symlink</text>
  <text x="1055" y="90" fill="#656D76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">你的项目</text>

  <!-- clone: one dashed line per repo into its cache slot -->
  <path class="line" stroke="#DE5C2A" d="M260 163 H455" marker-end="url(#m-zh-co)"/>
  <path class="line" stroke="#0F766E" d="M260 259 H455" marker-end="url(#m-zh-pe)"/>
  <path class="line" stroke="#4C63B6" d="M260 355 H455" marker-end="url(#m-zh-cm)"/>

  <!-- symlink many-to-many: 3×3 matrix, two landings per project -->
<path class="line" stroke="#DE5C2A" d="M745 155 C838 155, 878 158, 930 158" marker-end="url(#m-zh-co)"/>
<path class="line" stroke="#DE5C2A" d="M745 171 C838 171, 878 262, 930 262" marker-end="url(#m-zh-co)"/>
<path class="line" stroke="#0F766E" d="M745 251 C838 251, 878 294, 930 294" marker-end="url(#m-zh-pe)"/>
<path class="line" stroke="#0F766E" d="M745 267 C838 267, 878 366, 930 366" marker-end="url(#m-zh-pe)"/>
<path class="line" stroke="#4C63B6" d="M745 347 C838 347, 878 398, 930 398" marker-end="url(#m-zh-cm)"/>
<path class="line" stroke="#4C63B6" d="M745 363 C800 363, 840 190, 930 190" marker-end="url(#m-zh-cm)"/>

